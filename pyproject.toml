[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-video-editor"
version = "0.1.0"
description = "Local-first agentic video editor for autonomous rough cuts."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = []

[project.scripts]
ave = "agentic_video_editor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
